<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ESP32 Realtime Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 p-6">
  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">ESP32 Realtime Dashboard</h1>
        <p class="text-sm text-slate-500">Firebase Realtime Database • /lab/esp32/latest</p>
      </div>
      <div id="status" class="px-4 py-2 rounded-full text-sm font-semibold bg-emerald-100 text-emerald-700">
        ● LIVE • เชื่อมต่อ Firebase แล้ว
      </div>
    </div>

    <!-- Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border-t-4 border-red-500">
        <p class="text-sm font-semibold text-slate-500">🌡️ อุณหภูมิ</p>
        <h2 id="val-temp" class="text-4xl font-extrabold text-slate-800 my-2">-- °C</h2>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border-t-4 border-blue-500">
        <p class="text-sm font-semibold text-slate-500">💧 ความชื้นสัมพัทธ์</p>
        <h2 id="val-humi" class="text-4xl font-extrabold text-slate-800 my-2">-- %</h2>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border-t-4 border-amber-500">
        <p class="text-sm font-semibold text-slate-500">☀️ ความเข้มแสง</p>
        <h2 id="val-light" class="text-4xl font-extrabold text-slate-800 my-2">-- lx</h2>
      </div>
    </div>

    <!-- Chart -->
    <div class="bg-white p-6 rounded-2xl shadow-sm">
      <h3 class="text-lg font-bold text-slate-700 mb-4">กราฟแสดงค่าอุณหภูมิย้อนหลัง</h3>
      <canvas id="tempChart" class="w-full h-64"></canvas>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // กำหนด URL ของ Realtime Database โปรเจกต์ iot-134
    const firebaseConfig = {
      databaseURL: "https://iot-134-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // เตรียม Chart.js
    const ctx = document.getElementById('tempChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'อุณหภูมิ (°C)',
          data: [],
          borderColor: '#ef4444',
          backgroundColor: 'rgba(239, 68, 68, 0.1)',
          fill: true,
          tension: 0.4
        }]
      }
    });

    // ดึงค่า Realtime จาก /lab/esp32/latest
    onValue(ref(db, 'lab/esp32/latest'), (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('val-temp').innerText = (data.temp ?? '--') + ' °C';
        document.getElementById('val-humi').innerText = (data.humi ?? '--') + ' %';
        document.getElementById('val-light').innerText = (data.light ?? '--') + ' lx';

        // เพิ่มจุดกราฟ
        const now = new Date().toLocaleTimeString();
        chart.data.labels.push(now);
        chart.data.datasets[0].data.push(data.temp);
        if (chart.data.labels.length > 10) {
          chart.data.labels.shift();
          chart.data.datasets[0].data.shift();
        }
        chart.update();
      }
    });
  </script>
</body>
</html>
